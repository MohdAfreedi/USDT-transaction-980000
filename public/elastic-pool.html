<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elastic Pool</title>

<link rel="stylesheet" href="css/elastic-pool.css">

</head>

<body>

<div class="container">

<div class="top">

<div>

<h1 id="poolName">Elastic Pool</h1>

<p>Oracle Exadata Elastic Pool</p>

</div>

<button onclick="window.history.back()">
← Back
</button>

</div>


<div class="grid">

<div class="card">
<h3>Status</h3>
<p id="status"></p>
</div>

<div class="card">
<h3>Region</h3>
<p id="region"></p>
</div>

<div class="card">
<h3>Total OCPU</h3>
<p id="totalCpu">64</p>
</div>

<div class="card">
<h3>Used OCPU</h3>
<p id="usedCpu">24</p>
</div>

<div class="card">
<h3>Free OCPU</h3>
<p id="freeCpu">40</p>
</div>

<div class="card">
<h3>Memory</h3>
<p id="memory">1024 GB</p>
</div>

</div>


<div class="tableCard">

<h2>Database Servers</h2>

<table>

<thead>

<tr>

<th>Server Name</th>

<th>OCPU</th>

<th>Memory</th>

<th>Status</th>

</tr>

</thead>

<tbody id="serverTable">

</tbody>

</table>

</div>


<div class="tableCard">

<h2>Hosted Databases</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Type</th>

<th>Status</th>

</tr>

</thead>

<tbody>

<tr>

<td>HRDB</td>

<td>Autonomous</td>

<td>Running</td>

</tr>

<tr>

<td>FINANCEDB</td>

<td>Dedicated</td>

<td>Running</td>

</tr>

<tr>

<td>CRMDB</td>

<td>Autonomous</td>

<td>Running</td>

</tr>

</tbody>

</table>

</div>

<div class="actions">

<button>Resize Pool</button>

<button>Add Database Server</button>

<button>Create Database</button>

<button>Monitoring</button>

</div>

</div>

<script src="js/elastic-pool.js"></script>

</body>

</html>
